name: Build, Test, Publish

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Run Tests
        run: dotnet test -c Release --no-restore --no-build -v normal

      - name: Pack NuGet Package(s)
        run: dotnet pack -c Release --no-restore --no-build --output ~/nuget-packages

      - name: Upload Build Artifact(s)
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ~/nuget-packages

  # A separate job, so restore, build and tests never run with the OIDC token permission.
  publish:
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download Build Artifact(s)
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: nuget-packages

      # Exchanges the GitHub OIDC token for an API key that is valid for one hour.
      - name: NuGet Login
        id: login
        uses: NuGet/login@v1
        with:
          user: Fortnite-API

      - name: Push NuGet Package(s)
        run: |
          dotnet nuget push nuget-packages/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --skip-duplicate
